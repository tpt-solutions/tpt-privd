[workspace]
members = [
    "crates/tpt-privd-envelope",
    "crates/tpt-privd-transport",
    "crates/tpt-privd-policy",
    "crates/tpt-privd-audit",
    "crates/tpt-privd-client",
    "crates/tpt-privd-daemon",
    "xtask",
]
resolver = "2"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["TPT Solutions <phillip@icb.co.nz>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TPT-Solutions/tpt-privd"
homepage = "https://github.com/TPT-Solutions/tpt-privd"

[workspace.dependencies]
# Workspace members
tpt-privd-envelope = { path = "crates/tpt-privd-envelope", version = "0.1.0" }
tpt-privd-transport = { path = "crates/tpt-privd-transport", version = "0.1.0" }
tpt-privd-policy = { path = "crates/tpt-privd-policy", version = "0.1.0" }
tpt-privd-audit = { path = "crates/tpt-privd-audit", version = "0.1.0" }
tpt-privd-client = { path = "crates/tpt-privd-client", version = "0.1.0" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# Errors
thiserror = "2"

# Crypto / hashing
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"

# CLI / config
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"

# Observability (I11)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config JSON Schema (I8)
schemars = { version = "1", features = ["derive"] }

# Benchmarks (I12)
criterion = "0.5"

# Unix / Linux
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
